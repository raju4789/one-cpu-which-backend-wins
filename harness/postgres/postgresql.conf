# Shared Postgres config. Locked: identical for every stack.
# Sized for a 1 vCPU / 2 GB VM that also runs Nginx and the app.

listen_addresses = '*'
max_connections = 50

# Memory
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 4MB
maintenance_work_mem = 128MB

# One core: parallel query only adds overhead
max_worker_processes = 2
max_parallel_workers = 0
max_parallel_workers_per_gather = 0
max_parallel_maintenance_workers = 0

# JIT costs more than it saves on short OLTP queries
jit = off

# SSD
random_page_cost = 1.1
effective_io_concurrency = 200

# WAL. synchronous_commit stays on, like production.
wal_buffers = 16MB
min_wal_size = 256MB
max_wal_size = 1GB
checkpoint_completion_target = 0.9

# Query stats for the blog posts
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top

# Logging: errors only, no per-statement logging
log_min_duration_statement = -1
log_min_messages = warning
