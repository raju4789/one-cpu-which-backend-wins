# Shared Postgres config. Locked: identical for every stack.
# Sized for a 1 vCPU / 2 GB VM that also runs Nginx and the app.

listen_addresses = '*'
max_connections = 50

# Memory. The seeded database is about 470 MB, so 512 MB of shared buffers
# (the usual 25% of RAM) holds all of it. effective_cache_size only tells the
# planner how much memory can cache data; it allocates nothing.
shared_buffers = 512MB
effective_cache_size = 1GB
work_mem = 4MB
maintenance_work_mem = 128MB

# One core: parallel query only adds overhead
max_worker_processes = 2
max_parallel_workers = 0
max_parallel_workers_per_gather = 0
max_parallel_maintenance_workers = 0

# JIT costs more than it saves on short OLTP queries
jit = off

# SSD
random_page_cost = 1.1
effective_io_concurrency = 200

# WAL. synchronous_commit stays on, like production.
wal_buffers = 16MB
min_wal_size = 256MB
max_wal_size = 1GB
checkpoint_completion_target = 0.9

# Autovacuum: every like updates a row in posts (about 100,000 rows per
# 5 minutes at the limit). Vacuum in small, frequent passes instead of waiting
# for 20% of a table to be dead rows, which is gentler on a single core.
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# Query stats for the blog posts
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top

# Logging: errors only, no per-statement logging
log_min_duration_statement = -1
log_min_messages = warning
log_autovacuum_min_duration = 0   # log every vacuum, to line them up with latency in Grafana
