# Phase "nginx": Nginx micro-caches the feed for 1 second.
proxy_pass http://app;
proxy_cache feed;
proxy_cache_key $request_uri;      # the feed is global, the same for every user
proxy_cache_valid 200 1s;
proxy_ignore_headers Cache-Control Expires Set-Cookie;

# When the entry expires, one request refreshes it and the rest wait for it,
# instead of all of them hitting the app at once.
proxy_cache_lock on;
proxy_cache_lock_timeout 2s;

# No proxy_cache_use_stale: serving expired entries would break the contract's limit.
# The feed may be up to 2 seconds stale: the TTL is 1 second, but Nginx counts
# expiry in whole seconds, so an entry can live up to 2 (contract/README.md, rule 6).

add_header X-Cache-Status $upstream_cache_status always;
