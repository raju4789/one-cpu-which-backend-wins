# Shared Nginx config. Locked: identical for every stack.
# The /feed behaviour comes from modes/<mode>/feed.conf (proxy or cache).

worker_processes 1;                 # one core
worker_rlimit_nofile 65535;
pid /tmp/nginx.pid;

events {
    worker_connections 16384;       # k6 holds one keep-alive connection per VU
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100000;

    # The only request log in the system. Buffered so it doesn't write per request.
    log_format timed '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                     'rt=$request_time urt=$upstream_response_time cache=$upstream_cache_status';
    access_log /var/log/nginx/access.log timed buffer=64k flush=5s;
    error_log /dev/stderr warn;

    proxy_cache_path /var/cache/nginx/feed levels=1:2 keys_zone=feed:10m
                     max_size=100m inactive=10s use_temp_path=off;

    upstream app {
        server app:8080;
        keepalive 64;               # reuse connections to the app
    }

    server {
        listen 80 reuseport backlog=4096;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;

        location = /feed {
            include /etc/nginx/mode/feed.conf;
        }

        location / {
            proxy_pass http://app;
        }
    }

    # Internal only: connection and request counters for the Prometheus exporter
    server {
        listen 8082;
        access_log off;
        location = /stub_status {
            stub_status;
        }
    }
}
