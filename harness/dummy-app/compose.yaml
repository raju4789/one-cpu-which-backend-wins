# Harness validation only. Same shape every real stack's compose file follows:
# it only adds image/build for the "app" service. STACK_DIR is set by bin/up.
services:
  app:
    image: node:22.16.0-alpine@sha256:41e4389f3d988d2ed55392df4db1420ad048ae53324a8e2b7c6d19508288107e
    command: ["node", "/app/server.js"]
    volumes:
      - ${STACK_DIR}/server.js:/app/server.js:ro
