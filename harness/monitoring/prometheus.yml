global:
  scrape_interval: 5s
  evaluation_interval: 5s

# k6 metrics arrive by remote write, so they need no scrape job.
# The VMs can't reach each other directly (macOS isolates them), so the bench
# VM's exporters are scraped through Colima's port forwarding on the Mac.
# That's fine for 3 scrapes every 5 s. The load itself never goes this way.
scrape_configs:
  - job_name: cadvisor
    static_configs:
      - targets: ["host.lima.internal:8081"]

  - job_name: postgres
    static_configs:
      - targets: ["host.lima.internal:9187"]

  - job_name: nginx
    static_configs:
      - targets: ["host.lima.internal:9113"]

  # The stack's own metrics on :9464 (optional, see contract/README.md)
  - job_name: app
    static_configs:
      - targets: ["host.lima.internal:9464"]

  # node_exporter running natively on the Mac: shows whether k6 is short of CPU
  - job_name: mac
    static_configs:
      - targets: ["host.lima.internal:9100"]
