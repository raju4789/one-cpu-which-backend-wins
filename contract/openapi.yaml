openapi: 3.0.3
info:
  title: one-cpu-which-backend-wins API
  version: 1.0.0
  description: |
    The contract every stack implements. A stack is load tested only after it passes the contract tests.
    Authentication is out of scope: the caller identifies itself with the X-User-Id header.
servers:
  - url: http://localhost:8080

paths:
  /health:
    get:
      summary: Liveness check used by the harness
      responses:
        "200":
          description: App is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }

  /feed:
    get:
      summary: Latest 20 posts across all users, newest first
      description: |
        Global feed. Ordered by created_at DESC, then id DESC. Always 20 posts, no pagination.
        Must be served by a single query (no N+1).
      responses:
        "200":
          description: The feed
          content:
            application/json:
              schema:
                type: object
                required: [posts]
                properties:
                  posts:
                    type: array
                    maxItems: 20
                    items: { $ref: "#/components/schemas/Post" }

  /posts:
    post:
      summary: Create a post
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 280 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /posts/{id}/like:
    post:
      summary: Like a post
      description: |
        Idempotent. Liking a post twice returns 204 both times and like_count increases only once.
        The like row and the like_count update happen in one transaction.
      parameters:
        - $ref: "#/components/parameters/UserId"
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Liked (or already liked) }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  parameters:
    UserId:
      name: X-User-Id
      in: header
      required: true
      description: ID of an existing user
      schema: { type: integer, format: int64 }

  schemas:
    Author:
      type: object
      required: [id, username, display_name]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        display_name: { type: string }
    Post:
      type: object
      required: [id, body, like_count, created_at, author]
      properties:
        id: { type: integer, format: int64 }
        body: { type: string }
        like_count: { type: integer }
        created_at: { type: string, format: date-time }
        author: { $ref: "#/components/schemas/Author" }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

  responses:
    BadRequest:
      description: Invalid input, missing or unknown X-User-Id
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Post does not exist
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
